<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070b14"/></linearGradient><linearGradient id="cyanBlue" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="emeraldTeal" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><linearGradient id="glowPulse" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="100%" stop-color="#818cf8" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="telematicsGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".8" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1.5" fill="#334155" opacity=".5"/></pattern><style>@keyframes pulseFade{0%{opacity:.3}50%{opacity:.9}}@keyframes floatNode{0%{transform:translateY(0)}}@keyframes floatPill1{0%{transform:translate(0,0)}}@keyframes floatPill2{0%{transform:translate(0,0)}}@keyframes floatPill3{0%{transform:translate(0,0)}}@keyframes ping{75%{transform:scale(2.2);opacity:0}}.bg-grid{opacity:.85}.telemetry-track{stroke-dasharray:8 6;animation:dashMove 30s linear infinite}.signal-wave{animation:ping 2.5s cubic-bezier(0,0,.2,1) infinite}.pill-float-1{animation:floatPill1 6s ease-in-out infinite alternate}.pill-float-2{animation:floatPill2 5s ease-in-out infinite alternate}.pill-float-3{animation:floatPill3 7s ease-in-out infinite alternate}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="360" fill="url(#telematicsGrid)" class="bg-grid" rx="16"/><circle cx="150" cy="180" r="140" fill="#0284c7" filter="url(#glow)" opacity=".12"/><circle cx="1050" cy="180" r="180" fill="#3b82f6" filter="url(#glow)" opacity=".12"/><circle cx="600" cy="40" r="120" fill="#10b981" filter="url(#glow)" opacity=".08"/><g opacity=".55"><path fill="none" stroke="#0284c7" stroke-width="2" d="M -50 280 C 250 340, 350 180, 600 240 C 850 300, 950 120, 1250 160" class="telemetry-track" opacity=".6"/><path fill="none" stroke="#10b981" stroke-width="2" d="M -20 120 C 300 40, 450 260, 750 160 C 950 80, 1100 280, 1250 220" class="telemetry-track" opacity=".5" style="animation-duration:22s"/><g transform="translate(180, 290)"><circle cx="0" cy="0" r="16" fill="none" stroke="#38bdf8" stroke-width="1.5" class="signal-wave" opacity=".4" style="transform-origin:0 0"/><circle cx="0" cy="0" r="4" fill="#38bdf8" filter="url(#subtleGlow)"/></g><g transform="translate(1020, 150)"><circle cx="0" cy="0" r="20" fill="none" stroke="#34d399" stroke-width="1.5" class="signal-wave" opacity=".4" style="transform-origin:0 0"/><circle cx="0" cy="0" r="5" fill="#34d399" filter="url(#subtleGlow)"/></g><g transform="translate(680, 260)"><circle cx="0" cy="0" r="14" fill="none" stroke="#818cf8" stroke-width="1" class="signal-wave" opacity=".3" style="transform-origin:0 0"/><circle cx="0" cy="0" r="3.5" fill="#818cf8"/></g></g><g class="pill-float-1" transform="translate(60, 45)"><rect width="180" height="42" fill="#1e293b" fill-opacity=".8" stroke="#334155" stroke-width="1.2" rx="21"/><circle cx="24" cy="21" r="5" fill="#10b981" filter="url(#subtleGlow)"/><text x="38" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif