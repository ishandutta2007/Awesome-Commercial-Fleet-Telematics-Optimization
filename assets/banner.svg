<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="telematicsGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1.5" fill="#334155" opacity="0.5"/>
    </pattern>

    <!-- Moving Telemetry Particle Style -->
    <style>
      .bg-grid { opacity: 0.85; }
      .telemetry-track {
        stroke-dasharray: 8 6;
        animation: dashMove 30s linear infinite;
      }
      .telemetry-pulse {
        animation: pulseFade 3s ease-in-out infinite;
      }
      .vehicle-node {
        animation: floatNode 4s ease-in-out infinite alternate;
      }
      .signal-wave {
        animation: ping 2.5s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .pill-float-1 { animation: floatPill1 6s ease-in-out infinite alternate; }
      .pill-float-2 { animation: floatPill2 5s ease-in-out infinite alternate; }
      .pill-float-3 { animation: floatPill3 7s ease-in-out infinite alternate; }

      @keyframes dashMove {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes pulseFade {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.9; }
      }
      @keyframes floatNode {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes floatPill1 {
        0% { transform: translate(0, 0); }
        100% { transform: translate(6px, -8px); }
      }
      @keyframes floatPill2 {
        0% { transform: translate(0, 0); }
        100% { transform: translate(-8px, 6px); }
      }
      @keyframes floatPill3 {
        0% { transform: translate(0, 0); }
        100% { transform: translate(5px, 8px); }
      }
      @keyframes ping {
        75%, 100% {
          transform: scale(2.2);
          opacity: 0;
        }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Telematics Grid Overlay -->
  <rect width="1200" height="360" rx="16" fill="url(#telematicsGrid)" class="bg-grid"/>

  <!-- Radial ambient illumination circles (behind content) -->
  <circle cx="150" cy="180" r="140" fill="#0284c7" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1050" cy="180" r="180" fill="#3b82f6" opacity="0.12" filter="url(#glow)"/>
  <circle cx="600" cy="40" r="120" fill="#10b981" opacity="0.08" filter="url(#glow)"/>

  <!-- Animated Dynamic Background Route Paths (Behind Text) -->
  <g opacity="0.55">
    <!-- Curved Route Vector 1 -->
    <path d="M -50 280 C 250 340, 350 180, 600 240 C 850 300, 950 120, 1250 160" 
          fill="none" stroke="#0284c7" stroke-width="2" class="telemetry-track" opacity="0.6"/>
    <!-- Curved Route Vector 2 (Accent) -->
    <path d="M -20 120 C 300 40, 450 260, 750 160 C 950 80, 1100 280, 1250 220" 
          fill="none" stroke="#10b981" stroke-width="2" class="telemetry-track" opacity="0.5" style="animation-duration: 22s;"/>
    
    <!-- Moving GPS Signal Beacons in background -->
    <g transform="translate(180, 290)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" class="signal-wave" style="transform-origin: 0px 0px;"/>
      <circle cx="0" cy="0" r="4" fill="#38bdf8" filter="url(#subtleGlow)"/>
    </g>

    <g transform="translate(1020, 150)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.4" class="signal-wave" style="transform-origin: 0px 0px;"/>
      <circle cx="0" cy="0" r="5" fill="#34d399" filter="url(#subtleGlow)"/>
    </g>

    <g transform="translate(680, 260)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.3" class="signal-wave" style="transform-origin: 0px 0px;"/>
      <circle cx="0" cy="0" r="3.5" fill="#818cf8"/>
    </g>
  </g>

  <!-- Floating Telematics Metric Cards (Behind / Framing Content) -->
  <!-- Left Pill: Real-time Telemetry -->
  <g class="pill-float-1" transform="translate(60, 45)">
    <rect width="180" height="42" rx="21" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.2"/>
    <circle cx="24" cy="21" r="5" fill="#10b981" filter="url(#subtleGlow)"/>
    <text x="38" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">CAN-BUS / OBD-II LIVE</text>
  </g>

  <!-- Right Pill: Route Solved -->
  <g class="pill-float-2" transform="translate(960, 50)">
    <rect width="180" height="42" rx="21" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.2"/>
    <circle cx="24" cy="21" r="5" fill="#38bdf8" filter="url(#subtleGlow)"/>
    <text x="38" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">VRP SOLVER: &lt; 200ms</text>
  </g>

  <!-- Bottom Left Pill: AI Safety Score -->
  <g class="pill-float-3" transform="translate(80, 280)">
    <rect width="210" height="42" rx="21" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.2"/>
    <circle cx="24" cy="21" r="5" fill="#818cf8" filter="url(#subtleGlow)"/>
    <text x="38" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">AI VISION SAFETY: 98.4%</text>
  </g>

  <!-- Bottom Right Pill: ELD Compliance -->
  <g class="pill-float-1" transform="translate(930, 275)">
    <rect width="200" height="42" rx="21" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.2"/>
    <circle cx="24" cy="21" r="5" fill="#f59e0b" filter="url(#subtleGlow)"/>
    <text x="38" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">ELD / FMCSA COMPLIANT</text>
  </g>

  <!-- Centered High-Contrast Foreground Content (Protected from Occlusion) -->
  <g transform="translate(600, 135)" text-anchor="middle">
    <!-- Category Mini-Tag -->
    <rect x="-140" y="-35" width="280" height="26" rx="13" fill="#0369a1" fill-opacity="0.4" stroke="#0ea5e9" stroke-width="1"/>
    <text x="0" y="-18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8">ENTERPRISE TELEMATICS &amp; IOT</text>

    <!-- Main Title -->
    <text x="0" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      Commercial Fleet Telematics
    </text>
    
    <!-- Title Second Row with Gradient Text Effect -->
    <text x="0" y="74" fill="url(#cyanBlue)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      &amp; Route Optimization
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0.3">
      Curated SaaS Leaders &amp; Production-Ready Open-Source Telematics Architectures
    </text>
  </g>

  <!-- Border Frame Accent -->
  <rect width="1200" height="360" rx="16" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.6"/>
</svg>
